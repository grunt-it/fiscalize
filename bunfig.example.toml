# Bun configuration example.
# Copy this to bunfig.toml and set REGISTRY_TOKEN when consuming @grunt-it
# scoped packages (fiscalize itself is published to GitHub Packages).
#
#   export REGISTRY_TOKEN="ghp_…"   # a PAT with read:packages
#
# A bare `bun install` of fiscalize's own deps (all on public npm) needs no token.

[install.scopes]
"@grunt-it" = { token = "$REGISTRY_TOKEN", url = "https://npm.pkg.github.com" }
